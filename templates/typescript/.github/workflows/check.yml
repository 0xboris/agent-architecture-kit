name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Keep the baseline and the project checks from loosening
        if: github.event_name == 'pull_request'
        run: python3 tools/gateguard.py HEAD^1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Run the check
        run: ./check
      - name: Fail if ./check changed a tracked file, such as a check or an out-of-date module map
        run: git diff --exit-code
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: .check/
