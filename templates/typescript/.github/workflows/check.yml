name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Keep gate files out of branches other than main
        if: github.event_name == 'pull_request' && github.base_ref != github.event.repository.default_branch
        run: python3 tools/gateguard.py HEAD^1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Run the check
        run: ./check
      - name: Fail if the module map is out of date
        run: git diff --exit-code docs/architecture/modules.md
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: .check/
