name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the check
        run: ./check
      - name: Fail if the module map is out of date
        run: git diff --exit-code docs/architecture/modules.md
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: .check/
