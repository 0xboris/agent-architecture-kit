name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Keep the baseline and the project checks from loosening
        if: github.event_name == 'pull_request'
        run: python3 tools/gateguard.py HEAD^1
      - name: Run the existing project checks as the base branch has them
        if: github.event_name == 'pull_request'
        run: tools/run-base-checks.sh HEAD^1
      - name: Run the check
        run: ./check
      - name: Fail if ./check changed or added a file, such as a check or an out-of-date module map
        run: |
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: .check/
